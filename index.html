function guessKind(name) {
  const n = name.toLowerCase();
  if (/dead|rdl|hinge|good ?morning|hip thrust/.test(n)) return 'hinge';
  if (/squat|leg press/.test(n)) return 'squat';
  if (/bench|floor press|dip/.test(n)) return 'bench';
  if (/press|ohp|jerk/.test(n)) return 'press';
  if (/pull-? ?up|chin/.test(n)) return 'vpull';
  if (/row|pull/.test(n)) return 'row';
  return 'other';
}

/* ---------- export / import ---------- */
function exportPayload() {
  return {
    app: 'top-set',
    version: 1,
    exportedAt: new Date().toISOString(),
    settings: S.settings,
    sessions: realSessions().sort((a, b) => (sessKey(a) < sessKey(b) ? -1 : 1)),
    bodyweight: (Store.docs.bodyweight && Store.docs.bodyweight.entries) || {},
    accessories: Store.docs.accessories || null,
  };
}
function sanitizeSession(s) {
  if (!s || typeof s !== 'object' || s.sample || typeof s.id !== 'string' || !/^[A-Za-z0-9_-]{1,60}$/.test(s.id)) return null;
  if (typeof s.date !== 'string' || !ISO_RE.test(s.date) || !Array.isArray(s.lifts)) return null;
  const lifts = s.lifts.filter((l) => l && typeof l.liftId === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(l.liftId)).slice(0, 30).map((l) => {
    const sets = (Array.isArray(l.sets) ? l.sets : []).slice(0, 30).filter((x) => x && isFinite(+x.w) && isFinite(+x.r)).map((x) => {
      const o = { w: roundLb(clamp(+x.w, 0, 2000)), r: clamp(Math.round(+x.r), 0, 100) };
      if (x.add != null && isFinite(+x.add)) o.add = roundLb(clamp(+x.add, 0, 2000));
      if (typeof x.tag === 'string' && x.tag) o.tag = x.tag.slice(0, 40);
      return o;
    });
    const rpe = +l.rpe;
    const e = {
      liftId: l.liftId, name: String(l.name || l.liftId).slice(0, 40), kind: KINDS[l.kind] ? l.kind : 'other',
      skipped: !!l.skipped || !sets.length, sets,
      rpe: l.rpe != null && rpe >= 1 && rpe <= 10 ? Math.round(rpe * 2) / 2 : null,
      note: typeof l.note === 'string' ? l.note.slice(0, 500) : '',
    };
    if (l.bodyweight != null && +l.bodyweight > 0) e.bodyweight = roundLb(+l.bodyweight);
    return e;
  });
  const out = {
    id: s.id, date: s.date,
    startedAt: isFinite(+s.startedAt) ? +s.startedAt : null,
    finishedAt: isFinite(+s.finishedAt) ? +s.finishedAt : null,
    day: s.day === 'A' || s.day === 'B' ? s.day : null,
    short: !!s.short, note: typeof s.note === 'string' ? s.note.slice(0, 1000) : '', lifts,
  };
  if (Array.isArray(s.accessories)) out.accessories = clone(s.accessories.slice(0, 20));
  return out;
}
function importData(obj) {
  if (!obj || typeof obj !== 'object' || obj.app !== 'top-set' || !Array.isArray(obj.sessions)) throw new Error('That file isn’t a Top Set backup.');
  const months = {};
  let count = 0;
  for (const raw of obj.sessions) {
    const s = sanitizeSession(raw);
    if (!s) continue;
    const mid = 'log_' + s.date.slice(0, 7);
    if (!months[mid]) months[mid] = clone(Store.docs[mid]) || { type: 'log', month: s.date.slice(0, 7), sessions: {} };
    months[mid].sessions[s.id] = s;
    count++;
  }
  for (const mid of Object.keys(months)) Store.put(mid, months[mid]);
  let bwN = 0;
  if (obj.bodyweight && typeof obj.bodyweight === 'object') {
    const doc = clone(Store.docs.bodyweight) || { type: 'bw', entries: {} };
    if (!doc.entries) doc.entries = {};
    for (const d of Object.keys(obj.bodyweight)) {
      const lb = +obj.bodyweight[d];
      if (ISO_RE.test(d) && lb > 20 && lb < 1000) { doc.entries[d] = roundLb(lb); bwN++; }
    }
    if (bwN) Store.put('bodyweight', doc);
  }
  if (obj.settings && typeof obj.settings === 'object') { S.settings = normalizeSettings(obj.settings); applyTheme(S.settings.theme); saveSettings(); }
  if (obj.accessories && typeof obj.accessories === 'object' && !Array.isArray(obj.accessories)) Store.put('accessories', clone(obj.accessories));
  return { sessions: count, bw: bwN };
}
function openImportSheet() {
  openSheet('<h2 class="sheet-title">Import backup</h2><p class="sheet-body">Pick a Top Set JSON export, or paste one. Sessions merge by id, body weight merges by date, and settings are replaced.</p>' +
    '<label class="btn-quiet block" for="import-file">Choose file<input class="vh" type="file" id="import-file" data-input="import-file" accept=".json,application/json,text/plain"></label>' +
    '<label class="field"><span class="field-label">Or paste JSON</span><textarea class="text-in" id="import-text" rows="5" spellcheck="false" placeholder="{&quot;app&quot;: &quot;top-set&quot;, …}"></textarea></label>' +
    '<div class="sheet-actions"><button class="btn-quiet" data-act="sheet-close">Cancel</button><button class="btn-primary" data-act="import-run">Import</button></div>');
}

/* ---------- migration from device storage after signing in ---------- */
function checkMigration() {
  if (Store.mode !== 'db') return;
  const local = lsGet(LOCAL_KEY);
  if (!local || typeof local !== 'object') return;
  const have = new Set(realSessions().map((s) => s.id));
  let n = 0;
  for (const id of Object.keys(local)) {
    if (id.indexOf('log_') !== 0 || !local[id] || !local[id].sessions) continue;
    for (const sid of Object.keys(local[id].sessions)) if (!have.has(sid)) n++;
  }
  if (n) S.migrate = { n, local };
}

function completeFinish(markAll) {
  const d = S.draft; if (!d) return;
  if (markAll) d.items.forEach((it) => { if (!it.skipped) it.sets.forEach((s) => { s.done = true; }); });
  const session = buildSession(d);
  if (!session.lifts.some((l) => !l.skipped)) { toast('Check off at least one set, or discard the workout.'); return; }
  const wasEdit = !!d.editingOf;
  saveSession(session);
  if (!wasEdit && S.settings.nextW) {
    let used = false;
    session.lifts.forEach((l) => { if (!l.skipped && S.settings.nextW[l.liftId] != null) { delete S.settings.nextW[l.liftId]; used = true; } });
    if (used) saveSettings();
  }
  const summary = summarize(session);
  clearDraft();
  bump();
  render();
  window.scrollTo(0, 0);
  if (wasEdit) toast('Session updated');

}

/* ---------- inputs ---------- */
function commitSetInput(t, final) {
  const it = draftItem(t.dataset.lift); if (!it) return;
  const s = it.sets[+t.dataset.i]; if (!s) return;
  const raw = String(t.value).trim().replace(',', '.');
  if (t.dataset.input === 'w') {
    const v = Number(raw);
    const ok = raw !== '' && isFinite(v) && v >= 0 && v <= maxW();
    if (ok) { s.w = roundLb(fromDisp(v)); touchDraft(); }
    if (final) {
      if (!ok) toast(isFinite(v) && v < 0 ? 'Weight can’t be negative.' : 'Enter a weight from 0 to ' + maxW() + ' ' + units() + '.');
      t.value = fmtW(s.w);
      updateQuick(it);
    }
  } else {
    const cap = it.unit === 'sec' ? 600 : 100;
    const ok = /^\d{1,3}$/.test(raw) && +raw <= cap;
    if (ok) { s.r = +raw; touchDraft(); }
    if (final) {
      if (!ok) toast(it.unit === 'sec' ? 'Seconds are whole numbers from 0 to 600.' : 'Reps are whole numbers from 0 to 100.');
      t.value = String(s.r);
    }
  }
}
function commitFocused(except) {
  const a = document.activeElement;
  if (!a || a === except || !a.dataset) return;
  if (a.dataset.input === 'w' || a.dataset.input === 'r') { commitSetInput(a, true); a.blur(); }
}
function logBodyweight(raw) {
  const txt = String(raw || '').trim().replace(',', '.');
  const v = Number(txt);
  const lim = units() === 'kg' ? [25, 320] : [55, 700];
  if (!txt || !isFinite(v) || v < lim[0] || v > lim[1]) { toast('Enter body weight from ' + lim[0] + ' to ' + lim[1] + ' ' + units() + '.'); return; }
  const doc = clone(Store.docs.bodyweight) || { type: 'bw', entries: {} };
  if (!doc.entries) doc.entries = {};
  doc.entries[isoDate()] = roundLb(fromDisp(v));
  Store.put('bodyweight', doc);
  renderView('today');
  toast('Logged ' + fmtNum(v) + ' ' + units());
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (!fn) return;
  commitFocused(t);
  try { const r = fn(t, e); if (r && r.catch) r.catch((err) => console.error(err)); }
  catch (err) { console.error(err); toast('Something went wrong. Your log is safe.'); }
});
document.addEventListener('input', (e) => {
  const t = e.target; const k = t.dataset && t.dataset.input; if (!k) return;
  if (k === 'w' || k === 'r') commitSetInput(t, false);
  else if (k === 'note') { const it = draftItem(t.dataset.lift); if (it) { it.note = t.value.slice(0, 500); touchDraft(); } }
  else if (k === 'buddy') { S.chat.draft = t.value.slice(0, 2000); autosize(t); }
  else if (k === 'buddy-notes') { S.settings.buddyNotes = t.value.slice(0, 1000); saveSettings(); }
  else if (k === 'theme-color' || k === 'theme-hex') {
    let v = t.value.trim();
    if (v.charAt(0) !== '#') v = '#' + v;
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
    v = v.toUpperCase();
    setTheme({ preset: 'custom', accent: v }, false);
    const other = $(k === 'theme-color' ? '#theme-hex' : '#theme-color');
    if (other) other.value = k === 'theme-color' ? v : v.toLowerCase();
    const dot = $('.swatch[data-v="custom"] .sw-dot');
    if (dot) dot.style.background = v;
  }
  else if (k === 'orm-w' || k === 'orm-r') { S.tools[k === 'orm-w' ? 'ormW' : 'ormR'] = t.value.slice(0, 8); saveTools(); refreshToolOut('orm-out'); }
  else if (k === 'pct-base') { S.tools.pctBase = t.value.slice(0, 8); saveTools(); refreshToolOut('pct-out'); }
  else if (k === 'pl-target') { S.tools.plTarget = t.value.slice(0, 8); saveTools(); refreshToolOut('pl-out'); }
  else if (k === 'lift-name') {
    const sel = $('#lift-kind'); const g = guessKind(t.value);
    if (sel) sel.value = g;
    const bwBox = $('#lift-bw'); if (bwBox) bwBox.checked = g === 'vpull' || /dip|push-? ?up/i.test(t.value);
  }
});
document.addEventListener('change', (e) => {
  const t = e.target; const k = t.dataset && t.dataset.input; if (!k) return;
  if (k === 'w' || k === 'r') commitSetInput(t, true);
  else if (k === 'days-enabled') { S.settings.days.enabled = t.checked; S.dayChoice = null; saveSettings(); render(); }
  else if (k === 'sample') { S.settings.sampleHidden = !t.checked; saveSettings(); render(); }
  else if (k === 'theme-black') setTheme({ black: t.checked }, false);
  else if (k === 'cu-sec') {
    const lbl = $('#cu-reps-label'), reps = $('#cu-reps');

    if (reps && t.checked && reps.value === '10') reps.value = '30';
    if (reps && !t.checked && reps.value === '30') reps.value = '10';
  }
  else if (k === 'import-file') {

    const r = new FileReader();

document.addEventListener('focusin', (e) => {
  const t = e.target;
  if (t.classList && (t.classList.contains('w-in') || t.classList.contains('r-in'))) setTimeout(() => { try { t.setSelectionRange(0, t.value.length); } catch (err) { /* ignore */ } }, 0);
});
document.addEventListener('focusin', (e) => { if (e.target.id === 'buddy-input') document.body.classList.add('typing'); });
document.addEventListener('focusout', (e) => {
  if (e.target.id === 'buddy-input') setTimeout(() => { if (document.activeElement !== $('#buddy-input')) document.body.classList.remove('typing'); }, 120);
});
document.addEventListener('focusout', () => {
  if (!S.renderPending) return;
  setTimeout(() => { if (S.renderPending && !isEditing()) { S.renderPending = false; render(); } }, 400);
});
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (d.matches && d.matches('details.more')) { const it = draftItem(d.dataset.lift); if (it) it.moreOpen = d.open; }
}, true);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { flushTimer('doc:settings'); flushTimer('doc:draft'); }
  else if (Store.mode === 'db') Store.retryDirty();
});
window.addEventListener('pagehide', () => { flushTimer('doc:settings'); flushTimer('doc:draft'); });
window.addEventListener('online', () => { if (Store.mode === 'db') Store.retryDirty(); });
window.addEventListener('resize', () => later('resize', 200, () => { if (S.tab === 'progress' && S.loaded && $('#sheet-root').hidden) renderView('progress'); }));

function isEditing() {
  const a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') && a.closest('#views, #sheet-root'));
}
function onRemoteChange() {
  bump();
  if (!Store.pending('settings') && Store.docs.settings) { S.settings = normalizeSettings(Store.docs.settings); applyTheme(S.settings.theme); }
  if (!S.chat.busy && !Store.pending('chat')) loadChat();
  if (isEditing() || !$('#sheet-root').hidden) { S.renderPending = true; return; }
  render();
}

function updateTabDot() {
  const dot = $('#tabbar .tab[data-tab="today"] .tab-dot');
  if (dot) dot.hidden = !S.draft;
}
function buildTabbar() {
  $('#tabbar').innerHTML = TABS.filter((t) => !(t === 'buddy' && S.buddyOff)).map((t) =>
    '<button class="tab" role="tab" data-act="tab" data-tab="' + t + '" aria-selected="false">' + icon(t) + '<span>' + TAB_LABEL[t] + '</span>' + (t === 'today' ? '<i class="tab-dot" hidden></i>' : '') + '</button>').join('');
}
function go(tab, opts) {
  if (TABS.indexOf(tab) < 0 || (tab === 'buddy' && S.buddyOff)) tab = 'today';
  const changed = S.tab !== tab || (opts && opts.force);
  const toBuddy = tab === 'buddy' && S.tab !== 'buddy';
  if (S.tab !== tab) S.scroll[S.tab] = window.scrollY;
  S.tab = tab;
  lsSet(TAB_KEY, tab);
  $$('#tabbar .tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $$('.view').forEach((v) => { v.hidden = v.dataset.view !== tab; });
  render();
  const v = $('.view[data-view="' + tab + '"]');
  if (changed && v && !reduceMotion) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
  if (toBuddy) window.scrollTo(0, document.documentElement.scrollHeight);
  else window.scrollTo(0, S.scroll[tab] || 0);
}

function installHeadTags() {
  const add = (tag, attrs) => {
    try { const el = document.createElement(tag); Object.keys(attrs).forEach((k) => el.setAttribute(k, attrs[k])); document.head.appendChild(el); } catch (e) { /* ignore */ }
  };
  add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
  add('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' });
  add('meta', { name: 'apple-mobile-web-app-title', content: 'Top Set' });
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#2B52D4'; g.fillRect(0, 0, 180, 180);
    g.fillStyle = '#FFFFFF';
    const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); };
    rr(14, 82, 152, 16, 5);
    rr(50, 38, 22, 104, 6); rr(108, 38, 22, 104, 6);
    rr(32, 58, 14, 64, 5); rr(134, 58, 14, 64, 5);
    add('link', { rel: 'apple-touch-icon', href: c.toDataURL('image/png') });
  } catch (e) { /* ignore */ }
}

async function boot() {
  applyTheme(lsGet(THEME_KEY));
  installHeadTags();
  buildTabbar();
  const prog = lsGet(PROG_KEY);
  if (prog && typeof prog === 'object') {
    if (RANGES.some((r) => r[0] === prog.range)) S.prog.range = prog.range;
    if (METRICS.some((r) => r[0] === prog.metric)) S.prog.metric = prog.metric;
  }
  const saved = lsGet(TAB_KEY);
  const hash = (location.hash || '').replace('#', '');
  S.tab = TABS.indexOf(hash) >= 0 ? hash : TABS.indexOf(saved) >= 0 ? saved : 'today';
  go(S.tab, { force: true });

  const C = window.claude;
  if (C && typeof C.use === 'function') {
    C.use('downloads').then((d) => { S.caps.downloads = d; }, () => {});
    C.use('sample').then((fn) => { S.caps.sample = fn; if (!fn) hideBuddy(); }, () => hideBuddy());
    C.use('user').then(async (u) => {
      let owner = false;
      try { owner = !!u && (await u.isOwner()); } catch (e) { owner = false; }
      if (!owner) hideBuddy();
    }, () => hideBuddy());
  } else hideBuddy();
  await Store.init();
  S.settings = normalizeSettings(Store.docs.settings);
  applyTheme(S.settings.theme);
  restoreDraft();
  loadChat();
  checkMigration();
  S.loaded = true;
  bump();
  if (S.draft) S.tab = 'today';
  go(S.tab, { force: true });
  setInterval(() => { if (S.draft && !S.draft.editingOf) updateWkHead(); }, 15000);
}
boot();
})();
</script>
