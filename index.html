/* Layout: one column of rounded "attempt cards" over a cool ground tinted toward the 20 kg plate blue;

  --warn: #A3610F;
  --warn-soft: #F6EAD7;
  --bad: #BA3830;
  --bad-ink: #FFFFFF;

  --scrim: rgba(12, 14, 20, 0.42);
  --knob: #FFFFFF;
  --toast-bg: #12151C;
  --toast-fg: #F2F4F8;
  --toast-action: #9DB3FF;
  --chart-line: #2B52D4;
  --chart-raw: #858DA0;
  --plate-red: #D9473F;
  --plate-blue: #2F62D8;
  --plate-yellow: #E7B520;
  --plate-green: #2F9E62;
  --plate-white: #EEF0F4;
  --plate-black: #30343D;
  --plate-chrome: #A8AFBC;
  --shadow: 0 1px 2px rgba(18, 21, 28, 0.05), 0 6px 20px rgba(18, 21, 28, 0.05);
  --shadow-sm: 0 1px 2px rgba(18, 21, 28, 0.10);
  --shadow-sheet: 0 -12px 40px rgba(12, 14, 20, 0.16);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;

  --r-card: 20px;
  --tabbar-h: 56px;
  color-scheme: light;
}

    --bar: rgba(13, 15, 20, 0.84);

    --knob: #F4F5F8;
    --toast-bg: #EDEFF4;

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--fg-3); }
.small { font-size: 13px; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 22px; height: 22px; flex: none; }

/* ---------- shell ---------- */
.shell {
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 4px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px);
  overflow-x: clip;
}
#banners { display: grid; gap: 8px; padding-top: 8px; }
#banners:empty { display: none; }
.banner {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 6px 6px 12px; min-height: 44px;
  border-radius: 14px; background: var(--surface-2);
  font-size: 14px; color: var(--fg-2);
}
.banner p { margin: 0; flex: 1; min-width: 0; padding-block: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.warn { background: var(--warn); }
.dot.good { background: var(--good); }

.view { display: grid; gap: 16px; }
.view.enter { animation: viewIn .22s ease-out; }
@keyframes viewIn { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head { display: grid; gap: 2px; padding-top: 14px; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: .005em; text-wrap: balance; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); }
.card.pad { padding: 16px; }
.card-title { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.05; }
.group { display: grid; gap: 8px; }
.group-title { margin: 0; padding-inline: 4px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); }
.group-note { margin: 0; padding-inline: 4px; font-size: 13px; color: var(--fg-3); }
.qlabel { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); }

/* ---------- buttons ---------- */
.btn-primary, .btn-quiet, .btn-danger, .btn-danger-quiet {
  min-height: 48px; padding: 0 18px; border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: 16px; text-align: center;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:active { filter: brightness(.94); }
.btn-quiet { background: var(--surface-2); color: var(--fg); }
.btn-quiet:active { background: var(--line); }
.btn-danger { background: var(--bad); color: var(--bad-ink); }
.btn-danger-quiet { color: var(--bad); background: transparent; }
.btn-primary.sm, .btn-quiet.sm { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn-primary.lg { min-height: 56px; font-size: 18px; }
.block { width: 100%; }
.link { min-height: 44px; padding: 0 10px; color: var(--accent); font-weight: 600; font-size: 14px; border-radius: 10px; flex: none; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--fg-2); flex: none; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; }

/* ---------- today: plan ---------- */
.daypick .seg { max-width: 320px; }
.seg-note { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-left: 4px; }
.plan { padding: 6px 16px 16px; display: grid; }
.plan-head { display: flex; justify-content: space-between; padding: 10px 0 4px; }
.plan-list { list-style: none; margin: 0; padding: 0; }
.plan-row {
  display: grid; grid-template-columns: minmax(7.5em, 1fr) auto; column-gap: 12px; row-gap: 1px;
  align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line);
}
.plan-row:last-child { border-bottom: 0; }
.plan-name { font-weight: 600; font-size: 17px; min-width: 0; }
.plan-last { font-size: 23px; text-align: right; }
.plan-sub { grid-column: 1 / -1; font-size: 13px; color: var(--fg-3); }
.btn-start {
  margin-top: 10px; min-height: 64px; border-radius: 18px;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-size: 27px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 8px 22px -8px var(--accent);
  transition: transform .12s ease;
}
.btn-start:active { transform: scale(.985); }
.btn-start:disabled { opacity: .55; box-shadow: none; }
.btn-start .ic { width: 26px; height: 26px; }
.sk { height: 44px; border-radius: 12px; background: var(--surface-2); margin-top: 10px; animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

/* ---------- body weight ---------- */
.bw { padding: 16px; display: grid; gap: 12px; }
.bw-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bw-form { display: flex; gap: 10px; align-items: center; }
.in-wrap { position: relative; flex: 1; min-width: 0; }
.big-in {
  width: 100%; height: 50px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px;
  padding: 0 44px 0 14px; font-family: var(--font-display); font-size: 26px; font-weight: 600;
}
.big-in::placeholder { color: var(--fg-3); opacity: .7; }
.in-unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-3); font-size: 14px; pointer-events: none; }
.bw-meta { margin: 0; font-size: 14px; color: var(--fg-2); display: flex; gap: 6px 14px; flex-wrap: wrap; }
.bw-meta b { color: var(--fg); font-weight: 600; }

/* ---------- lists ---------- */
.list { overflow: hidden; }
.list-row {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 10px 16px; min-height: 60px; text-align: left; border-bottom: 1px solid var(--line);
}
.list-row:last-child { border-bottom: 0; }
.list-row:active { background: var(--surface-2); }
.lr-main { display: grid; gap: 2px; min-width: 0; }
.lr-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.lr-sub { font-size: 13px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr-side { font-size: 21px; display: flex; align-items: baseline; gap: 4px; }
.lr-side small { font-family: var(--font-body); font-size: 12px; color: var(--fg-3); font-weight: 500; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--fg-3); }
.empty-mini { padding: 16px; color: var(--fg-3); font-size: 14px; margin: 0; }

/* ---------- workout ---------- */
.wk-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: -16px; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--bar); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  border-bottom: 1px solid var(--line);
}
.wk-title { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.05; }
.wk-sub { margin: 0; font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.cards { display: grid; gap: 12px; }
.wk-foot { display: grid; gap: 8px; padding-top: 4px; }

.lift-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow);
  padding: 12px 12px 4px; display: grid; gap: 12px;
}
.lift-card.flash { animation: flash .6s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent-line); } to { box-shadow: var(--shadow); } }
.lift-card.skipped { padding-bottom: 12px; background: transparent; box-shadow: none; border-style: dashed; }
.lc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-left: 4px; }
.lc-titles { min-width: 0; padding-top: 2px; }
.lc-name { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.05; display: flex; align-items: center; gap: 8px; }
.lc-done { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--good); background: var(--good-soft); padding: 3px 8px; border-radius: 999px; }
.lc-last { margin: 3px 0 0; color: var(--fg-2); font-size: 14px; }
.lc-quick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; padding-left: 4px; }
.lc-quick .qgroup:first-child .stepper { display: flex; }
.lc-quick .qgroup:first-child .val { flex: 1; min-width: 0; }
.qgroup { display: grid; gap: 5px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 14px; height: 48px; }
.stepper button { width: 44px; height: 48px; display: grid; place-items: center; color: var(--fg-2); border-radius: 14px; }
.stepper button:active { background: var(--line); }
.stepper button:disabled { opacity: .3; }
.stepper .val { min-width: 74px; text-align: center; font-size: 27px; line-height: 1; white-space: nowrap; }
.stepper .val.narrow { min-width: 30px; }
.stepper .val small { font-family: var(--font-body); font-size: 12px; color: var(--fg-3); margin-left: 2px; font-weight: 500; }

.sets-grid { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 44px; align-items: center; gap: 8px; }
.sets-head { padding: 0 4px 0 8px; }
.sets-head > span:nth-child(3) { text-align: center; }
.sets-head .link { min-height: 32px; padding: 0; font-size: 13px; text-align: center; }
.sets { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.set { padding: 4px 4px 4px 8px; border-radius: 14px; transition: background .18s; }
.set.done { background: var(--accent-soft); }
.set-n { font-size: 14px; color: var(--fg-3); font-variant-numeric: tabular-nums; font-weight: 600; }
.w-in {
  width: 100%; max-width: 104px; height: 44px; border: 0; border-radius: 12px;
  background: var(--surface-2); text-align: center; padding: 0 4px;
  font-family: var(--font-display); font-size: 25px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.set.done .w-in, .set.done .reps { background: var(--surface); }
.reps { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 12px; }
.reps button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--fg-2); border-radius: 12px; }
.reps button:active { background: var(--line); }
.reps .ic { width: 18px; height: 18px; }
.r-in {
  width: 32px; height: 44px; border: 0; background: transparent; text-align: center; padding: 0;
  font-family: var(--font-display); font-size: 25px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.w-in:focus, .r-in:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.check {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center; color: var(--fg-3); background: var(--surface);
  transition: background .15s, border-color .15s, color .15s;
}
.check .ic { width: 22px; height: 22px; }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check.pop { animation: pop .3s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.78); } to { transform: scale(1); } }

.stick { display: grid; gap: 8px; padding: 12px; border-radius: 16px; background: var(--surface-2); animation: rise .24s ease-out; }
@keyframes rise { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.stick-q { margin: 0; font-size: 14px; font-weight: 600; color: var(--fg-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 15px; font-weight: 500; color: var(--fg);
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-strong); font-weight: 600; }
.chip-fine { color: var(--fg-2); }

.more { border-top: 1px solid var(--line); margin-inline: -12px; padding-inline: 16px; }
.more summary {
  list-style: none; min-height: 46px; display: flex; align-items: center; gap: 8px;
  color: var(--fg-2); font-size: 15px; cursor: pointer;
}
.more summary::-webkit-details-marker { display: none; }
.more summary .ic { width: 16px; height: 16px; transition: transform .18s; }
.more[open] summary .ic { transform: rotate(90deg); }
.more-val { margin-left: auto; color: var(--fg); font-weight: 600; font-size: 14px; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more-body { display: grid; gap: 10px; padding-bottom: 14px; }
.rpe-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.rpe-row::-webkit-scrollbar { display: none; }
.rpe { flex: none; min-width: 46px; height: 44px; border-radius: 12px; background: var(--surface-2); font-family: var(--font-display); font-size: 21px; font-weight: 600; }
.rpe[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.note {
  width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 12px; padding: 10px 12px; font-size: 16px; line-height: 1.4;
}

/* ---------- settings ---------- */
.lift-row { display: flex; align-items: center; gap: 2px; padding-right: 6px; border-bottom: 1px solid var(--line); }
.lift-row:last-child { border-bottom: 0; }
.lr-btn { flex: 1; min-width: 0; display: grid; gap: 2px; text-align: left; padding: 10px 8px 10px 16px; min-height: 60px; }
.lr-btn:active { background: var(--surface-2); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; }
.seg button { flex: 1 1 auto; min-height: 44px; padding: 0 8px; border-radius: 10px; font-size: 14.5px; font-weight: 600; color: var(--fg-2); white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
.fields { display: grid; gap: 18px; }
.field { display: grid; gap: 8px; }
.field-label { font-size: 14px; font-weight: 600; color: var(--fg-2); }
.text-in {
  width: 100%; min-height: 48px; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 12px; padding: 0 12px; font-size: 16px;
}
textarea.text-in { padding: 10px 12px; min-height: 120px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; resize: vertical; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; cursor: pointer; }
.switch-row > span:first-child { display: grid; gap: 2px; }
.track { width: 51px; height: 31px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: var(--knob); box-shadow: var(--shadow-sm); transition: transform .2s;
}
input:checked + .track { background: var(--accent); }
input:checked + .track::after { transform: translateX(20px); }
input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.day-edit { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 8px; }
.data-card { display: grid; gap: 14px; }
.status-row { display: flex; gap: 12px; align-items: flex-start; }
.status-row .dot { margin-top: 7px; }
.status-row > div { display: grid; gap: 2px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > * { flex: 1 1 140px; }
.foot-note { text-align: center; color: var(--fg-3); font-size: 12px; margin: 8px 0 0; }

/* ---------- empty ---------- */
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 40px 20px; border: 1px dashed var(--line); border-radius: var(--r-card); }
.empty h2 { margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.05; }
.empty p { margin: 0; color: var(--fg-2); max-width: 34ch; }
.empty-ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); }
.empty-ic .ic { width: 28px; height: 28px; }

/* ---------- sheet ---------- */
#sheet-root { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .22s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
  max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1);
  display: grid; gap: 14px; box-shadow: var(--shadow-sheet);
}
#sheet-root.open .scrim { opacity: 1; }
#sheet-root.open .sheet { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 0; }
.sheet-title { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.05; }
.sheet-body { margin: 0; color: var(--fg-2); }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet-actions > * { flex: 1 1 120px; }
.menu { display: grid; }
.menu-item { min-height: 54px; text-align: left; padding: 0 4px; font-size: 17px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.menu-item:last-child { border-bottom: 0; }
.menu-item:disabled { opacity: .35; }
.menu-item.danger { color: var(--bad); }
.menu-item .ic { color: var(--fg-3); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.stat-v { font-size: 30px; line-height: 1; }
.stat-l { font-size: 12px; color: var(--fg-3); }
.delta { font-size: 13px; font-weight: 600; white-space: nowrap; }
.delta.up { color: var(--good); }
.delta.down, .delta.flat { color: var(--fg-3); }
.sum-sec { display: grid; gap: 8px; }
.sum-h { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); display: flex; justify-content: space-between; }
.sum-h span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--fg-3); }
.pr-list, .by-lift, .detail-list { list-style: none; margin: 0; padding: 0; display: grid; }
.pr-list { gap: 6px; }
.pr { display: grid; gap: 4px; padding: 10px 12px; border-radius: 14px; background: var(--good-soft); }
.pr-name { font-weight: 600; }
.pr-items { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; }
.pr-items em { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--good); margin-right: 2px; }
.pr-items b { font-size: 20px; }
.by-lift li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.by-lift li:last-child { border-bottom: 0; }
.bl-name { display: grid; min-width: 0; font-weight: 600; }
.bl-name small { font-weight: 400; font-size: 13px; color: var(--fg-3); }
.bl-v { font-size: 21px; }
.callout { display: grid; gap: 10px; padding: 12px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-strong); }
.callout p { margin: 0; font-size: 14px; }
.detail-list li { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.detail-list li:last-child { border-bottom: 0; }
.dl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dl-head .num { font-size: 21px; text-align: right; }
.dl-meta { font-size: 13px; color: var(--fg-3); }
.dl-note { font-size: 14px; color: var(--fg-2); }

/* ---------- progress ---------- */
.prog-filters { display: grid; gap: 8px; }
.prog-card { padding: 16px 16px 4px; display: grid; gap: 12px; }
.pc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pc-titles { min-width: 0; }
.pc-name { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.05; }
.pc-sub { margin: 3px 0 0; font-size: 13px; color: var(--fg-3); }
.pc-big { display: grid; justify-items: end; gap: 2px; text-align: right; flex: none; }
.pc-val { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: .95; }
.pc-val small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--fg-3); margin-left: 3px; }
.chart { position: relative; margin-inline: -4px; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; overflow: visible; -webkit-user-select: none; user-select: none; }
.chart svg:focus { outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-tick { fill: var(--fg-3); font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.ch-line { fill: none; stroke: var(--chart-line); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-dot { fill: var(--chart-line); stroke: var(--surface); stroke-width: 2; }
.ch-raw { fill: var(--chart-raw); stroke: var(--surface); stroke-width: 1.5; }
.ch-end { fill: var(--fg); font-size: 13px; font-weight: 700; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.ch-mark { stroke: var(--fg-3); stroke-width: 1; }
.ch-pin { fill: var(--fg-3); }
.ch-mark-label { fill: var(--fg-2); font-size: 11px; font-weight: 600; font-family: var(--font-body); }
.ch-cross { stroke: var(--fg-2); stroke-width: 1; }
.ch-hi { fill: var(--chart-line); stroke: var(--surface); stroke-width: 2.5; }
.ch-hit { fill: transparent; }
.ch-tip {
  position: absolute; top: 2px; left: 0; z-index: 2; pointer-events: none;
  display: grid; gap: 1px; min-width: 112px; max-width: 210px; padding: 8px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  font-size: 13px; opacity: 0; transition: opacity .12s;
}
.ch-tip.show { opacity: 1; }
.ch-tip .td { color: var(--fg-3); font-size: 12px; }
.ch-tip .tv { display: flex; align-items: center; gap: 6px; }
.ch-tip .tv i { width: 12px; height: 2px; border-radius: 1px; background: var(--chart-line); flex: none; }
.ch-tip .tv b { color: var(--fg); font-size: 15px; }
.ch-tip .ts { color: var(--fg-2); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; border-radius: 1px; background: var(--chart-line); }
.key-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chart-raw); }
.chart-note { margin: 0; font-size: 13px; color: var(--fg-3); }
.pr-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pr-cell { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; display: grid; gap: 1px; align-content: start; min-width: 0; }
.pr-cell b { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.pr-cell b small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--fg-3); margin-left: 2px; }
.pr-cell > span:last-child { font-size: 12px; color: var(--fg-3); }
.pr-reps { grid-column: 1 / -1; }
.rr-list { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.rr-list span { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.rr-list small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--fg-3); margin-left: 4px; }
.tbl { border-top: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.tbl summary { list-style: none; min-height: 44px; display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 15px; cursor: pointer; }
.tbl summary::-webkit-details-marker { display: none; }
.tbl summary .ic { width: 16px; height: 16px; transition: transform .18s; }
.tbl[open] summary .ic { transform: rotate(90deg); }
.tbl-wrap { overflow-x: auto; margin: 0 -16px 10px; padding: 0 16px; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl tr[data-act] { cursor: pointer; }
.tbl tr[data-act]:active td { background: var(--surface-2); }
.tbl .icon-btn { width: 36px; height: 36px; margin: -6px 0; }
.tbl .icon-btn .ic { width: 16px; height: 16px; }

/* ---------- plateaus + accessories ---------- */
.pill { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent-strong); }
.alert { display: grid; gap: 10px; }
.alert-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.alert-title { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.05; }
.alert-body { margin: 0; font-size: 14px; color: var(--fg-2); }
.pc-flag { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: -4px; }
.acc-sec { display: grid; gap: 10px; border-top: 1px solid var(--line); margin-inline: -16px; padding: 12px 16px 2px; }
.acc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.acc-item { display: grid; gap: 8px; padding: 12px; border-radius: 16px; background: var(--surface-2); }
.acc-item .ch-dot, .acc-item .ch-hi, .acc-item .ch-raw { stroke: var(--surface-2); }
.acc-item .ch-tip { background: var(--surface); }
.acc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.acc-top b { font-size: 16px; min-width: 0; }
.acc-meta { margin: 0; font-size: 13px; color: var(--fg-2); }
.acc-past { margin: 0; font-size: 13px; color: var(--fg-3); }
.rec { display: grid; gap: 8px; padding: 14px; border-radius: 16px; background: var(--surface-2); }
.rec-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.rec-name { margin: 0; font-family: var(--font-display); font-size: 25px; font-weight: 700; line-height: 1.05; }
.rec-load { font-size: 11px; color: var(--fg-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.rec-why { margin: 0; font-size: 14px; color: var(--fg-2); }
.rec-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--fg-3); }
.tagchip { padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; font-size: 12px; }
.rec-rx { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rec-rx div { background: var(--surface); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.rec-rx dt { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.rec-rx dd { margin: 0; font-size: 14px; font-weight: 600; }

/* ---------- all options + custom ---------- */
.allopts { border-top: 1px solid var(--line); }
.allopts summary { list-style: none; min-height: 48px; display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 15px; font-weight: 600; cursor: pointer; }
.allopts summary::-webkit-details-marker { display: none; }
.allopts summary .ic { width: 16px; height: 16px; transition: transform .18s; }
.allopts[open] summary .ic { transform: rotate(90deg); }
.opt-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.opt-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.opt-sub { font-size: 13px; color: var(--fg-3); }
.cu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.notes-in { font-family: var(--font-body) !important; font-size: 16px !important; min-height: 92px !important; line-height: 1.4; }

/* ---------- buddy ---------- */
.buddy-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.buddy-note { margin: 0; font-size: 13px; color: var(--fg-3); padding: 8px 12px; border-radius: 12px; background: var(--surface-2); }
.chat { display: grid; gap: 12px; align-content: start; min-height: 30vh; }
.chat-empty { display: grid; gap: 14px; padding: 8px 2px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest .chip { text-align: left; line-height: 1.25; padding-block: 8px; }
.msg { max-width: 88%; display: grid; gap: 6px; justify-self: start; }
.msg.me { justify-self: end; }
.bubble { padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; min-width: 0; }
.msg.me .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.msg.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.bubble p { margin: 0 0 8px; }
.bubble p:last-child, .bubble ul:last-child { margin-bottom: 0; }
.bubble ul { margin: 2px 0 8px; padding-left: 20px; }
.bubble li { margin: 3px 0; }
.bubble code { font-size: 14px; }
.bubble .cut { font-size: 13px; color: var(--fg-3); }
.thinking { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-3); }
.thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); animation: blink 1.2s infinite ease-in-out; }
.thinking i:first-of-type { margin-left: 3px; }
.thinking i:nth-of-type(2) { animation-delay: .2s; }
.thinking i:nth-of-type(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.act-card { display: grid; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-strong); font-size: 14px; font-weight: 600; }
.act-card.done { display: flex; justify-content: space-between; gap: 10px; background: var(--good-soft); color: var(--good); }
.act-card.muted-card { background: var(--surface-2); color: var(--fg-2); font-weight: 500; }
.chat-err { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.chat-err p { margin: 0; padding-block: 6px; }
.composer {
  position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 4;
  display: flex; gap: 8px; align-items: flex-end; padding: 6px 6px 6px 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
}
@media (hover: none) and (pointer: coarse) {
  body.typing .composer { bottom: 10px; }
  body.typing .tabbar { display: none; }
}
.composer textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; font-size: 16px; line-height: 1.4; padding: 9px 8px; max-height: 140px; }
.composer textarea:focus { outline: none; }
.composer:focus-within { border-color: var(--accent-line); }
.send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; }
.send.stop { background: var(--fg); color: var(--bg); }

/* ---------- tools ---------- */
.tool { display: grid; gap: 12px; }
.tool-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tool-in { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    if (db && user) { try { uid = await user.id(); } catch (e) { uid = null; } }
    if (uid && typeof user.can === 'function') {
      try { if ((await user.can('data.write')) === false) uid = null; } catch (e) { /* not told: try saving and fall back if refused */ }
    }
    if (db && uid) {
      try {
        const col = db.collection('data/users/' + uid);
        const snap = await col.get();
        const docs = {};
        snap.docs.forEach((d) => { if (d.exists) docs[d.id] = clone(d.data()); });
        this.col = col;
        this.docs = docs;
        this.mode = 'db';
        this.subscribe();
        return;
      } catch (e) { console.warn('db unavailable, using this device', e); }
    }
    this.mode = 'local';
    const local = lsGet(LOCAL_KEY);
    this.docs = local && typeof local === 'object' ? local : {};
  },

  pending(id) { return (this.inflight[id] || 0) > 0 || !!timers['doc:' + id]; },

  subscribe(retry) {
    try {
      this.unsub = this.col.onSnapshot((snap) => {
        let changed = false;
        for (const ch of snap.docChanges()) {
          const id = ch.doc.id;
          if (id === 'draft' || this.pending(id)) continue;
          if (ch.type === 'removed') {
            if (id in this.docs) { delete this.docs[id]; changed = true; }
            continue;
          }
          const data = ch.doc.data();
          if (!data) continue;
          if (JSON.stringify(this.docs[id]) !== JSON.stringify(data)) { this.docs[id] = clone(data); changed = true; }
        }
        if (changed) onRemoteChange();
      }, (err) => {
        console.warn('sync stopped', err);
        if (err && err.code === 'unavailable' && !retry) setTimeout(() => this.subscribe(true), 3000);
      });
    } catch (e) { console.warn(e); }
  },

  put(id, body) { this.docs[id] = body; bump(); return this.persist(id); },
  remove(id) { delete this.docs[id]; bump(); return this.persist(id); },

  persist(id) {
    if (this.mode !== 'db') { this.saveLocal(); return Promise.resolve(true); }
    for (const d of Array.from(this.dirty)) if (d !== id) { this.dirty.delete(d); this.persist(d); }
    const seq = (this.seq[id] = (this.seq[id] || 0) + 1);
    this.inflight[id] = (this.inflight[id] || 0) + 1;
    const run = async () => {
      if (this.mode !== 'db') { this.saveLocal(); return true; }
      try {
        if (seq !== this.seq[id]) return true; // a newer write for this doc is queued
        await this.write(id);
        this.dirty.delete(id);
        return true;
      } catch (e) {
        if (e && e.code === 'invalid_argument' && this.mode === 'db') { this.toLocal(); return false; }
        this.dirty.add(id);
        this.onError(e);
        return false;
      } finally {
        this.inflight[id]--;
      }
    };
    const p = (this.chains[id] || Promise.resolve()).then(run);
    this.chains[id] = p;
    return p;
  },

  async write(id) {
    const ref = this.col.doc(id);
    const go = () => (this.docs[id] === undefined ? ref.delete() : ref.set(clone(this.docs[id])));
    try { await go(); }
    catch (e) {
      if (!e || e.code === 'unavailable' || !e.code) { await sleep(500 + Math.random() * 700); await go(); }
      else throw e;
    }
  },

  saveLocal() {
    const docs = Object.assign({}, this.docs);
    delete docs.draft;
    const ok = lsSet(LOCAL_KEY, docs);
    if (!ok && !this.warnedLocal) {
      this.warnedLocal = true;
      toast('This browser blocked storage. Export a backup before you close the page.');
    }
  },

  // The account can read but not save here: keep everything on this device instead.
  toLocal() {
    this.mode = 'local';
    try { if (this.unsub) this.unsub(); } catch (e) { /* ignore */ }
    this.dirty.clear();
    this.saveLocal();
    toast('This account can’t save here, so your log stays on this device.');
    renderBanners();
  },

  retryDirty() { for (const id of Array.from(this.dirty)) { this.dirty.delete(id); this.persist(id); } },

  onError(e) {
    const now = Date.now();
    if (now - this.lastErrAt < 4000) return;
    this.lastErrAt = now;
    const code = e && e.code;
    if (code === 'quota_exceeded') toast('Your storage is full. Export a backup, then delete old data.');
    else if (code === 'revoked' || code === 'not_granted') toast('Lost access to your account storage. Changes stay on this screen until you reload.');
    else if (code === 'invalid_argument') toast('That save was refused. Export a backup to keep this data.');
    else toast("Couldn't reach your account. It will retry on your next change.");
  },
};

function makeItem(lift) {

  else sets = [0, 1, 2].map(() => ({ w: bw ? 0 : 45, r: 5, done: false }));

  if (nw != null && sets.length) {
    const top = Math.max.apply(null, sets.map((x) => x.w));
    sets.forEach((x) => { x.w = Math.max(0, roundLb(x.w + (nw - top))); });
  }
  const it = { liftId: lift.id, name: lift.name, kind: lift.kind, skipped: false, sets, rpe: null, note: '', tag: null, moreOpen: false };

}

    const vol = setsVolume(L.sets);

    '<section class="card plan"><div class="sk"></div><div class="sk"></div><div class="sk"></div>' +
    '<button class="btn-start" disabled>Loading your log…</button></section>';
}

function renderIdle() {
  const day = effectiveDay();
  const lifts = liftsForDay(day);
  let h = '<header class="page-head"><p class="eyebrow">' + todayEyebrow() + '</p><h1 class="title">Today</h1></header>';
  if (S.settings.days.enabled) {
    const sug = suggestedDay();
    h += '<div class="daypick"><div class="seg" role="radiogroup" aria-label="Workout day">' + ['A', 'B'].map((d) =>
      '<button role="radio" aria-checked="' + (d === day) + '" data-act="day" data-day="' + d + '">Day ' + d + (d === sug ? '<span class="seg-note">up next</span>' : '') + '</button>').join('') + '</div></div>';
  }
  h += '<section class="card plan">';
  if (lifts.length) {
    h += '<div class="plan-head"><span class="qlabel">' + lifts.length + ' lift' + (lifts.length === 1 ? '' : 's') + '</span><span class="qlabel">Last time</span></div>';
    h += '<ul class="plan-list">' + lifts.map(planRow).join('') + '</ul>';
  } else {
    h += '<p class="empty-mini">No lifts set up. Add one in Settings.</p>';
  }
  h += '<button class="btn-start" data-act="start"' + (lifts.length ? '' : ' disabled') + '>Start workout' + icon('arrow') + '</button>' +
    (lifts.length ? '<button class="btn-quiet block sd-btn" data-act="short-open">' + icon('clock') + '30-minute session</button>' : '') + '</section>';
  h += headsUp();
  h += bodyweightCard();
  h += recentSessions();
  return h;
}
function planRow(l) {
  const last = lastEntry(l.id);
  if (!last) {
    return '<li class="plan-row"><span class="plan-name">' + esc(l.name) + '</span><span class="plan-last num">—</span><span class="plan-sub">No history yet. Starts at 3 × 5 @ ' + (l.bw ? 'BW' : fmtW(45)) + '.</span></li>';
  }
  const tag = entryTag(last.entry);
  const bits = [fmtRel(last.session.date)];
  if (last.entry.rpe) bits.push('RPE ' + last.entry.rpe);
  if (tag && tag !== 'fine') bits.push('hard ' + tag);
  const nw = S.settings.nextW ? S.settings.nextW[l.id] : null;
  if (nw != null) bits.unshift('next ' + loadLabel(nw, !!l.bw));
  if (last.session.sample) bits.push('sample');
  accDoc().active.filter((a) => a.liftId === l.id).forEach((a) => bits.push('+ ' + a.name));
  return '<li class="plan-row"><span class="plan-name">' + esc(l.name) + '</span><span class="plan-last num">' + esc(setsSummary(last.entry.sets)) + '</span><span class="plan-sub">' + esc(bits.join(' · ')) + '</span></li>';
}
function bodyweightCard() {
  const list = bwEntries();
  const today = list.find((e) => e.date === isoDate());
  const last = list[list.length - 1];
  const a7 = bwAvg(list, 7, 0);
  const p7 = bwAvg(list, 14, 7);
  const meta = [];
  if (today) meta.push('Today <b>' + fmtW(today.lb) + '</b>');
  else if (last) meta.push('Last <b>' + fmtW(last.lb) + '</b> ' + fmtRel(last.date).toLowerCase());
  if (a7 != null) meta.push('7-day avg <b>' + fmtW(a7) + '</b>');
  if (a7 != null && p7 != null) {
    const d = toDisp(a7) - toDisp(p7);
    meta.push((d >= 0 ? '+' : '−') + fmtNum(Math.abs(d)) + ' vs prior week');
  }
  return '<section class="card bw"><div class="bw-top"><h2 class="card-title">Body weight</h2><span class="muted small">' + (today ? 'Logging again replaces today' : 'One entry per day') + '</span></div>' +
    '<form class="bw-form" id="bw-form" novalidate><div class="in-wrap"><input class="big-in" id="bw-input" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="' + (last ? fmtW(last.lb) : '0') + '" aria-label="Body weight in ' + units() + '"><span class="in-unit">' + units() + '</span></div>' +
    '<button class="btn-primary" type="submit">Log</button></form>' +
    (meta.length ? '<p class="bw-meta">' + meta.map((m) => '<span>' + m + '</span>').join('') + '</p>' : '') + '</section>';
}
function recentSessions() {
  const list = allSessions().slice(-5).reverse();
  let h = '<section class="group"><h2 class="group-title">Recent sessions</h2>';
  if (!list.length) return h + '<div class="card"><p class="empty-mini">Sessions you finish show up here.</p></div></section>';
  h += '<div class="card list">' + list.map(sessionRow).join('') + '</div></section>';
  return h;
}
function sessionRow(s) {
  const names = s.lifts.filter((l) => !l.skipped).map((l) => l.name).join(', ');
  return '<button class="list-row" data-act="session" data-id="' + esc(s.id) + '"><span class="lr-main"><span class="lr-title">' + esc(fmtRel(s.date)) + (s.day ? ' · Day ' + s.day : '') + (s.short ? ' · 30 min' : '') + (s.sample ? '<span class="badge">Sample</span>' : '') + '</span><span class="lr-sub">' + esc(names || 'No sets') + '</span></span>' +
    '<span class="lr-side num">' + fmtInt(sessionVolume(s)) + '<small>' + units() + '</small></span></button>';
}

function wkCounts() {
  let total = 0, done = 0;
  for (const it of S.draft.items) if (!it.skipped) { total += it.sets.length; done += it.sets.filter((s) => s.done).length; }
  return { total, done };
}
function wkSub() {
  const d = S.draft;
  const c = wkCounts();
  const bits = [c.done + '/' + c.total + ' sets'];
  if (d.day) bits.push('Day ' + d.day);
  if (!d.editingOf) bits.push(elapsed(d.startedAt) + (d.short ? ' of 30' : ''));
  else bits.push(fmtDay(d.date));
  return bits.join(' · ');
}
function renderWorkout() {
  const d = S.draft;
  let h = '<header class="wk-head"><div><h1 class="wk-title">' + (d.editingOf ? 'Edit session' : d.short ? '30-min workout' : 'Workout') + '</h1><p class="wk-sub" id="wk-sub">' + esc(wkSub()) + '</p></div>' +
    '<button class="btn-primary sm" data-act="finish">' + (d.editingOf ? 'Save' : 'Finish') + '</button></header>';
  h += '<div class="cards">' + d.items.map((it, i) => renderCard(it, i)).join('') + '</div>';
  h += '<div class="wk-foot"><button class="btn-primary block lg" data-act="finish">' + (d.editingOf ? 'Save changes' : 'Finish workout') + '</button>' +
    '<button class="btn-quiet block" data-act="discard">' + (d.editingOf ? 'Cancel edit' : 'Discard workout') + '</button></div>';
  return h;
}
function renderCard(it) {
  const lid = esc(it.liftId);
  if (it.skipped) {
    return '<article class="lift-card skipped" data-card="' + lid + '"><div class="lc-head"><div class="lc-titles"><h3 class="lc-name">' + esc(it.name) + '</h3><p class="lc-last">Skipped today</p></div>' +
      '<button class="btn-quiet sm" data-act="unskip" data-lift="' + lid + '">Undo</button></div></article>';
  }
  const before = S.draft.editingOf ? { id: S.draft.editingOf, date: S.draft.date, startedAt: S.draft.startedAt } : null;
  let lastTxt;
  if (it.acc) lastTxt = accCardLine(it, before);
  else {
    const last = lastEntry(it.liftId, before);
    lastTxt = last
      ? 'Last · ' + setsSummary(last.entry.sets) + (isBwEntry(last.entry) ? '' : ' ' + units()) + ' · ' + fmtRel(last.session.date)
      : it.bw ? 'No history yet. Add weight if you wear a belt.' : 'No history yet. Set your working weight.';
  }
  const open = it.sets.filter((s) => !s.done);
  const ref = open.length ? open : it.sets;
  const topW = ref.length ? Math.max.apply(null, ref.map((s) => s.w)) : 0;
  const allDone = it.sets.length > 0 && !open.length;
  const lastDone = it.sets.length > 0 && it.sets[it.sets.length - 1].done;
  const uname = units();

  let h = '<article class="lift-card" data-card="' + lid + '">';
  h += '<div class="lc-head"><div class="lc-titles"><h3 class="lc-name">' + esc(it.name) + (allDone ? '<span class="lc-done">Done</span>' : '') + '</h3><p class="lc-last">' + esc(lastTxt) + '</p></div>' +
    '<button class="icon-btn" data-act="card-menu" data-lift="' + lid + '" aria-label="Options for ' + esc(it.name) + '">' + icon('more') + '</button></div>';
  h += '<div class="lc-quick"><div class="qgroup"><span class="qlabel">' + (it.bw ? 'Added · open sets' : 'Weight · open sets') + '</span><div class="stepper">' +
    '<button data-act="all-w" data-lift="' + lid + '" data-d="-1" aria-label="Lower weight on open sets"' + (open.length ? '' : ' disabled') + '>' + icon('minus') + '</button>' +
    '<span class="val num" data-q="w">' + quickW(it, topW) + '</span>' +
    '<button data-act="all-w" data-lift="' + lid + '" data-d="1" aria-label="Raise weight on open sets"' + (open.length ? '' : ' disabled') + '>' + icon('plus') + '</button></div></div>' +
    '<div class="qgroup"><span class="qlabel">Sets</span><div class="stepper">' +
    '<button data-act="sets" data-lift="' + lid + '" data-d="-1" aria-label="Remove a set"' + (it.sets.length > 1 ? '' : ' disabled') + '>' + icon('minus') + '</button>' +
    '<span class="val num narrow">' + it.sets.length + '</span>' +
    '<button data-act="sets" data-lift="' + lid + '" data-d="1" aria-label="Add a set"' + (it.sets.length < 12 ? '' : ' disabled') + '>' + icon('plus') + '</button></div></div></div>';
  h += '<div class="sets-grid sets-head"><span class="qlabel" aria-hidden="true">#</span><span class="qlabel">' + (it.bw ? 'Added · ' : 'Weight · ') + uname + '</span><span class="qlabel">' + (it.unit === 'sec' ? 'Sec' : 'Reps') + '</span>' +
    '<button class="link" data-act="all-done" data-lift="' + lid + '" aria-label="' + (allDone ? 'Uncheck all sets' : 'Log all sets') + '">' + (allDone ? 'None' : 'All') + '</button></div>';
  h += '<ol class="sets">' + it.sets.map((s, i) =>
    '<li class="set sets-grid' + (s.done ? ' done' : '') + '"><span class="set-n">' + (i + 1) + '</span>' +
    '<input class="w-in" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="' + fmtW(s.w) + '" data-input="w" data-lift="' + lid + '" data-i="' + i + '" aria-label="Set ' + (i + 1) + (it.bw ? ' added weight in ' : ' weight in ') + uname + '">' +
    '<div class="reps"><button data-act="rep" data-lift="' + lid + '" data-i="' + i + '" data-d="-1" aria-label="Fewer reps on set ' + (i + 1) + '">' + icon('minus') + '</button>' +
    '<input class="r-in" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" value="' + s.r + '" data-input="r" data-lift="' + lid + '" data-i="' + i + '" aria-label="Set ' + (i + 1) + ' reps">' +
    '<button data-act="rep" data-lift="' + lid + '" data-i="' + i + '" data-d="1" aria-label="More reps on set ' + (i + 1) + '">' + icon('plus') + '</button></div>' +
    '<button class="check" data-act="done" data-lift="' + lid + '" data-i="' + i + '" aria-pressed="' + !!s.done + '" aria-label="Log set ' + (i + 1) + '">' + icon('check') + '</button></li>').join('') + '</ol>';
  if (lastDone && !it.acc) {
    const chips = (KINDS[it.kind] || KINDS.other).chips;
    h += '<div class="stick"><p class="stick-q">Where did it get hard?</p><div class="chips">' + chips.map((c) =>
      '<button class="chip' + (c === 'fine' ? ' chip-fine' : '') + '" aria-pressed="' + (it.tag === c) + '" data-act="tag" data-lift="' + lid + '" data-v="' + esc(c) + '">' + esc(capFirst(c)) + '</button>').join('') + '</div></div>';
  }
  const moreBits = [];
  if (it.rpe != null) moreBits.push('RPE ' + it.rpe);
  if (it.note && it.note.trim()) moreBits.push('Note');
  h += '<details class="more" data-lift="' + lid + '"' + (it.moreOpen ? ' open' : '') + '><summary>' + icon('chevron') + '<span>RPE &amp; note</span><span class="more-val">' + esc(moreBits.join(' · ')) + '</span></summary>' +
    '<div class="more-body"><div class="rpe-row" role="group" aria-label="RPE">' + RPE_VALUES.map((v) =>
      '<button class="rpe" data-act="rpe" data-lift="' + lid + '" data-v="' + v + '" aria-pressed="' + (it.rpe === v) + '">' + v + '</button>').join('') + '</div>' +
    '<textarea class="note" rows="2" maxlength="500" placeholder="Note for ' + esc(it.name) + '" data-input="note" data-lift="' + lid + '" aria-label="Note for ' + esc(it.name) + '">' + esc(it.note) + '</textarea></div></details>';
  h += '</article>';
  return h;
}
function refreshCard(it, opts) {
  const el = document.querySelector('[data-card="' + CSS.escape(it.liftId) + '"]');
  if (!el) { renderView('today'); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = renderCard(it);
  const fresh = tmp.firstElementChild;
  if (opts && opts.pop != null) {
    const c = fresh.querySelectorAll('.check')[opts.pop];
    if (c) c.classList.add('pop');
  }
  if (opts && opts.popAll) fresh.querySelectorAll('.check').forEach((c) => c.classList.add('pop'));
  el.replaceWith(fresh);
  updateWkHead();
}
function updateWkHead() {
  const el = $('#wk-sub');
  if (el && S.draft) el.textContent = wkSub();
}
function updateQuick(it) {
  const card = document.querySelector('[data-card="' + CSS.escape(it.liftId) + '"]');
  const q = card && card.querySelector('[data-q="w"]');
  if (!q) return;
  const open = it.sets.filter((s) => !s.done);
  const ref = open.length ? open : it.sets;
  const topW = ref.length ? Math.max.apply(null, ref.map((s) => s.w)) : 0;
  q.innerHTML = quickW(it, topW);
}
function quickW(it, w) {
  if (it.bw) return w > 0 ? '<small>BW</small>+' + fmtW(w) : 'BW';
  return fmtW(w) + '<small>' + units() + '</small>';
}

function recommend(liftId) {

  const cooling = doc.history.filter((h) => h.liftId === liftId && h.verdict === 'not' && h.exId && daysBetween(h.endDate, today) < SWAP_COOLDOWN_DAYS);

  const score = {}, why = {};

    if (!ACC_LIB[ex] || blocked.has(ex)) return;
    score[ex] = (score[ex] || 0) + pts;
    if (tag) { why[ex] = why[ex] || []; if (why[ex].indexOf(tag) < 0) why[ex].push(tag); }
  };

  const generic = !tags.length;

const VERDICT_LABEL = { working: 'Working', not: 'Not working', unclear: 'Too early to tell', stopped: 'Stopped early' };
function statusPill(st, a) {

function onBuddyError(e) {
  const c = S.chat;
  const code = (e && e.code) || 'upstream_error';
  const partial = e && typeof e.text === 'string' ? e.text : '';
  if (BUDDY_OFF_CODES.indexOf(code) >= 0) { hideBuddy(); toast('The buddy isn’t available in this view.'); return; }
  if (code === 'cancelled') { if (partial) pushReply(partial, true); return; }
  if (code === 'refused') { c.error = 'The buddy won’t answer that one. Try asking it differently.'; return; }
  if (partial) pushReply(partial, true);
  if (code === 'rate_limited') { c.cooldownUntil = Date.now() + 60000; c.error = 'Too many messages right now. Try again in a minute.'; setTimeout(() => refreshBuddy(false), 60500); return; }
  if (code === 'session_expired') { c.error = 'Sign in to claude.ai again to keep chatting.'; return; }
  if (code === 'prompt_too_large') { c.turns = c.turns.slice(-3); c.error = 'The conversation got too long, so older messages were dropped. Send that again.'; return; }
  if (code === 'empty_completion') { c.error = 'No answer came back. Try rephrasing.'; return; }
  c.error = 'The connection dropped.';
  c.retryable = !partial;
}
async function sendBuddy(text, retry) {
  const c = S.chat;
  if (c.busy) return;
  if (c.cooldownUntil > Date.now()) { toast('Give it a minute before the next message.'); return; }
  let sample = S.caps.sample;
  if (!sample && window.claude && typeof window.claude.use === 'function') {
    try { sample = await window.claude.use('sample'); S.caps.sample = sample; } catch (e) { sample = null; }
  }
  if (!sample) { hideBuddy(); toast('The buddy isn’t available in this view.'); return; }
  if (!retry) {
    const msg = String(text || '').trim();
    if (!msg) return;
    c.turns.push({ role: 'user', content: msg.slice(0, 2000), t: Date.now() });
    c.draft = '';
    const box = $('#buddy-input');
    if (box) { box.value = ''; autosize(box); }
  } else if (!c.turns.length || c.turns[c.turns.length - 1].role !== 'user') return;
  c.busy = true; c.partial = ''; c.error = null; c.retryable = false;
  refreshBuddy(true);
  const ctl = new AbortController();
  c.ctl = ctl;
  try {
    const res = await sample(buddyInput(), {
      cache: false,
      signal: ctl.signal,
      onText: (u) => { c.partial = u.text; updatePending(); },
    });
    pushReply(res.text, false);
    if (res.truncated) c.error = 'That answer got cut off. Ask for less at once.';
  } catch (e) {
    onBuddyError(e);
  } finally {
    c.busy = false; c.ctl = null; c.partial = '';
    saveChat();
    refreshBuddy(true);
  }
}
function autosize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }

  p.innerHTML = text ? mdLite(text) : '<span class="thinking">Thinking<i></i><i></i><i></i></span>';

}

/* =====================================================================
   Tools: 1RM, percentages, plates, next-session weight
   ===================================================================== */
const TOOLS_KEY = 'topset:v1:tools';
const PLATES = { lb: [45, 35, 25, 10, 5, 2.5], kg: [25, 20, 15, 10, 5, 2.5, 1.25] };
const BARS = { lb: [45, 35], kg: [20, 15] };
// plate: [color token, height fraction, width]
const PLATE_LOOK = {
  lb: { 45: ['blue', 1, 15], 35: ['yellow', 0.88, 13], 25: ['green', 0.74, 11], 10: ['white', 0.55, 8], 5: ['black', 0.44, 7], 2.5: ['chrome', 0.36, 6] },
  kg: { 25: ['red', 1, 15], 20: ['blue', 1, 13], 15: ['yellow', 0.9, 11], 10: ['green', 0.78, 9], 5: ['white', 0.55, 7], 2.5: ['black', 0.44, 6], 1.25: ['chrome', 0.36, 5] },
};
const numIn = (v) => { const t = String(v == null ? '' : v).trim().replace(',', '.'); return t === '' ? NaN : Number(t); };
const loadStep = () => (units() === 'kg' ? 2.5 : 5);
const roundLoad = (v) => Math.round(v / loadStep()) * loadStep();

function toolsState() {
  if (!S.tools) {
    const saved = lsGet(TOOLS_KEY) || {};
    S.tools = {
      ormW: typeof saved.ormW === 'string' ? saved.ormW : '', ormR: typeof saved.ormR === 'string' ? saved.ormR : '',
      pctBase: typeof saved.pctBase === 'string' ? saved.pctBase : '', plTarget: typeof saved.plTarget === 'string' ? saved.plTarget : '',
      bar: saved.bar || null, next: saved.next || null,
    };
  }
  const t = S.tools;
  const first = S.settings.lifts.find((l) => liftPoints(l.id).length);
  if (first) {
    const pts = liftPoints(first.id);
    const lastP = pts[pts.length - 1];
    if (t.ormW === '' && t.ormR === '') { t.ormW = fmtW(lastP.best.w); t.ormR = String(lastP.best.r); }
    if (t.pctBase === '') t.pctBase = fmtWhole(mainE1rm(first.id));
    if (t.plTarget === '') t.plTarget = fmtW(lastP.topW);
  }
  if (!t.next || !liftById(t.next)) t.next = (first || S.settings.lifts[0] || {}).id || null;
  if (BARS[units()].indexOf(t.bar) < 0) t.bar = BARS[units()][0];
  return t;
}
function saveTools() { lsSet(TOOLS_KEY, S.tools); }

function platesFor(target, bar) {
  const list = PLATES[units()];
  if (!(target >= bar)) return { per: [], loaded: bar, exact: false, rem: 0, under: true };
  let rem = (target - bar) / 2;
  const per = [];
  for (const p of list) while (rem >= p - 1e-6) { per.push(p); rem -= p; }
  const loaded = bar + 2 * per.reduce((a, b) => a + b, 0);
  return { per, loaded, exact: rem < 1e-6, rem: Math.max(0, rem) };
}
function perSideText(per) {
  if (!per.length) return 'Empty bar';
  const out = [];
  per.forEach((p) => { const g = out[out.length - 1]; if (g && g.p === p) g.n++; else out.push({ p, n: 1 }); });
  return out.map((g) => fmtNum(g.p) + (g.n > 1 ? '×' + g.n : '')).join(' + ');
}
function plateSvg(per) {
  const look = PLATE_LOOK[units()];
  const W = 320, H = 128, cy = 64, maxH = 112;
  let g = '<rect class="pl-bar" x="0" y="' + (cy - 5) + '" width="36" height="10" rx="2"/>' +
    '<rect class="pl-collar" x="36" y="' + (cy - 16) + '" width="10" height="32" rx="2"/>' +
    '<rect class="pl-sleeve" x="46" y="' + (cy - 8) + '" width="' + (W - 50) + '" height="16" rx="3"/>';
  const total = per.reduce((a, p) => a + look[p][2] + 2, 0);
  const k = total > W - 56 ? (W - 56) / total : 1;
  let x = 50;
  per.forEach((p) => {
    const L = look[p];
    const w = L[2] * k, h = maxH * L[1];
    g += '<rect class="pl-plate" x="' + x.toFixed(1) + '" y="' + (cy - h / 2).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" style="fill: var(--plate-' + L[0] + ')"/>';
    x += w + 2 * k;
  });
  return '<svg class="plate-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc('One side: ' + perSideText(per)) + '">' + g + '</svg>';
}

function ormHtml() {
  const t = S.tools;
  const w = numIn(t.ormW), r = numIn(t.ormR);
  if (!(w > 0) || w > maxW() || !Number.isInteger(r) || r < 1 || r > 30) return '<p class="chart-note">Enter a weight and 1–30 reps.</p>';
  const one = w * (1 + r / 30);
  return '<div class="res"><span class="res-v">' + Math.round(one) + '<small>' + units() + '</small></span><span class="res-l">estimated 1RM from ' + fmtNum(w) + ' × ' + r + '</span></div>' +
    '<div class="rm-row">' + [2, 3, 5, 8, 10].map((n) => '<div class="rm-cell"><span>' + n + 'RM</span><b>' + Math.round(one / (1 + n / 30)) + '</b></div>').join('') + '</div>' +
    '<button class="btn-quiet sm" data-act="orm-to-pct" data-v="' + Math.round(one) + '">Use ' + Math.round(one) + ' for percentages</button>';
}
function pctHtml() {
  const base = numIn(S.tools.pctBase);
  if (!(base > 0) || base > maxW() * 1.2) return '<p class="chart-note">Enter a 1RM.</p>';
  const bar = S.tools.bar;
  let rows = '';
  for (let pc = 100; pc >= 50; pc -= 5) {
    const w = roundLoad((base * pc) / 100);
    const pl = platesFor(w, bar);
    rows += '<tr data-act="pct-row" data-w="' + w + '"><td>' + pc + '%</td><td class="r"><b>' + fmtNum(w) + '</b></td><td>' + esc(pl.under ? 'Below bar' : perSideText(pl.per)) + '</td></tr>';
  }
  return '<div class="tbl-wrap"><table class="pct-table"><thead><tr><th>%</th><th class="r">' + units() + '</th><th>Per side · ' + bar + ' bar</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="small muted">Rounded to the nearest ' + loadStep() + ' ' + units() + '. Tap a row to load it below.</p>';
}
function platesHtml() {
  const t = S.tools;
  const target = numIn(t.plTarget), bar = t.bar, u = units();
  if (!(target > 0) || target > maxW()) return '<p class="chart-note">Enter the total you want on the bar.</p>';
  if (target < bar) return plateSvg([]) + '<p class="chart-note">That’s less than the ' + bar + ' ' + u + ' bar.</p>';
  const r = platesFor(target, bar);
  const smallest = PLATES[u][PLATES[u].length - 1];
  let h = plateSvg(r.per) + '<p class="pl-text"><b>Per side:</b> ' + esc(perSideText(r.per)) + '</p>';
  if (r.exact) h += '<p class="small muted">' + fmtNum(r.loaded) + ' = ' + bar + ' bar + 2 × ' + fmtNum((r.loaded - bar) / 2) + '</p>';
  else h += '<p class="small pl-warn">Can’t make ' + fmtNum(target) + ' exactly. Closest: ' + fmtNum(r.loaded) + ' or ' + fmtNum(r.loaded + 2 * smallest) + '.</p>';
  return h;
}

// Next-session weight from the last session's reps and RPE. Weights in lb; bodyweight lifts use added load.
function nextSuggestion(liftId) {
  const lift = liftById(liftId);
  const pts = liftPoints(liftId);
  if (!lift || !pts.length) return null;
  const last = pts[pts.length - 1];
  const e = last.entry;
  const bw = isBwEntry(e);
  const load = (x) => (bw ? x.add || 0 : x.w);
  const top = Math.max.apply(null, e.sets.map(load));
  const topSets = e.sets.filter((x) => Math.abs(load(x) - top) < 0.01);
  const counts = {};
  topSets.forEach((x) => { counts[x.r] = (counts[x.r] || 0) + 1; });
  const target = +Object.keys(counts).sort((a, b) => counts[b] - counts[a] || b - a)[0];
  const missed = topSets.reduce((a, x) => a + Math.max(0, target - x.r), 0);
  const step = fromDisp(stepDisp());
  const lower = lift.kind === 'squat' || lift.kind === 'hinge';
  const rpe = e.rpe;
  const cut = S.settings.goal === 'cutting';
  let next = top, reason;
  if (!missed) {
    let steps;
    if (bw) { steps = 0; reason = 'All sets hit ' + target + '. Add a rep per set before adding weight.'; }
    else if (rpe == null) { steps = lower ? 2 : 1; reason = 'All ' + topSets.length + ' sets hit ' + target + '. No RPE logged, so a standard jump.'; }
    else if (rpe <= 7) { steps = lower ? 3 : 2; reason = 'All ' + target + 's at RPE ' + rpe + '. Room for a bigger jump.'; }
    else if (rpe <= 8.5) { steps = lower ? 2 : 1; reason = 'All ' + target + 's at RPE ' + rpe + '.'; }
    else if (rpe <= 9 && !cut) { steps = 1; reason = 'All ' + target + 's at RPE ' + rpe + '. Small jump.'; }
    else { steps = 0; reason = 'All ' + target + 's, but RPE ' + rpe + (cut ? ' on a cut' : '') + '. Repeat it and make it move faster.'; }
    next = top + steps * step;
  } else {
    const prev = pts[pts.length - 2];
    let prevMissed = false;
    if (prev) {
      const pTop = Math.max.apply(null, prev.entry.sets.map(load));
      if (Math.abs(pTop - top) < 0.01) prevMissed = prev.entry.sets.some((x) => Math.abs(load(x) - top) < 0.01 && x.r < target);
    }
    if (prevMissed && !bw) { next = top * 0.9; reason = 'Missed reps at ' + fmtW(top) + ' two sessions running. Drop about 10% and build back.'; }
    else { reason = 'Missed ' + missed + ' rep' + (missed === 1 ? '' : 's') + ' last time. Same weight, get all ' + target + 's.'; }
  }
  next = roundToStep(next);
  return { lift, last, bw, top, target, sets: topSets.length, next, reason, rpe };
}
const loadLabel = (lb, bw) => (bw ? (lb > 0 ? 'BW+' + fmtW(lb) : 'BW') : fmtW(lb));
function nextHtml() {
  const id = S.tools.next;
  const lift = liftById(id);
  if (!lift) return '<p class="chart-note">Add a lift in Settings first.</p>';
  const sg = nextSuggestion(id);
  if (!sg) return '<p class="chart-note">Log ' + esc(lift.name) + ' once to get a suggestion.</p>';
  const set = S.settings.nextW && S.settings.nextW[id] != null ? S.settings.nextW[id] : null;
  const d = toDisp(sg.next) - toDisp(sg.top);
  const pill = Math.abs(d) < 0.01 ? '<span class="pill">Same</span>' : '<span class="pill ' + (d > 0 ? 'good' : 'warn') + '">' + (d > 0 ? '+' : '−') + fmtNum(Math.abs(d)) + ' ' + units() + '</span>';
  let h = '<p class="small muted">Last · ' + esc(setsSummary(sg.last.entry.sets)) + ' · ' + esc(fmtRel(sg.last.date)) + ' · ' + (sg.rpe != null ? 'RPE ' + sg.rpe : 'no RPE') + '</p>' +
    '<div class="res"><span class="res-v">' + esc(loadLabel(sg.next, sg.bw)) + (sg.bw ? '' : '<small>' + units() + '</small>') + '</span><span class="res-l">' + sg.sets + ' × ' + sg.target + '</span>' + pill + '</div>' +
    '<p class="alert-body">' + esc(sg.reason) + '</p>';
  if (set != null) {
    h += '<div class="btn-row next-set"><span class="pill good">Next workout: ' + esc(loadLabel(set, sg.bw)) + '</span><button class="btn-quiet sm" data-act="next-clear" data-lift="' + esc(id) + '">Clear</button></div>';
  } else if (Math.abs(d) < 0.01) {
    h += '<p class="small muted">Your next workout already pre-fills this.</p>';
  } else {
    h += '<button class="btn-primary block" data-act="next-use" data-lift="' + esc(id) + '" data-w="' + sg.next + '">Use ' + esc(loadLabel(sg.next, sg.bw)) + ' next workout</button>';
  }

}

    '<div class="tool-out" id="pl-out">' + platesHtml() + '</div></section>';
  h += '<section class="card pad tool"><div class="tool-head"><h2 class="card-title">Next session</h2><span class="muted small">From your last reps and RPE</span></div>' +
    (S.settings.lifts.length ? '<div class="chips">' + S.settings.lifts.map((l) => '<button class="chip" aria-pressed="' + (l.id === t.next) + '" data-act="next-lift" data-lift="' + esc(l.id) + '">' + esc(l.name) + '</button>').join('') + '</div>' : '') +
    '<div class="tool-out" id="next-out">' + nextHtml() + '</div></section>';
  return h;
}

/* ---------- 30-minute session ---------- */
function shortEstimate(liftIds, accId) {
  let min = 0;
  liftIds.forEach((id) => { const l = liftById(id); if (l) min += 4 + makeItem(l).sets.length * 2.5; });
  if (accId) { const a = accDoc().active.find((x) => x.id === accId); if (a) min += makeAccItem(a).sets.length * 1.5; }
  return Math.round(min);
}
function shortSelection() {
  const accBtn = $('[data-act="sd-acc"][aria-pressed="true"]');
  return {
    lifts: $$('[data-act="sd-lift"][aria-pressed="true"]').map((b) => b.dataset.id),
    acc: accBtn && accBtn.dataset.id !== 'none' ? accBtn.dataset.id : null,
  };
}
function updateShortEst() {
  const el = $('#sd-est');

  if (hi - lo < minSpan) { const mid = (hi + lo) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
  const pad = (hi - lo) * 0.12 || Math.max(1, Math.abs(hi) * 0.04);
  const ys = niceScale(lo - pad, hi + pad, 3);
  const X = (t) => padL + ((t - t0) / (t1 - t0)) * pw;
  const Y = (v) => padT + (1 - (v - ys.lo) / (ys.hi - ys.lo)) * ph;
  const f = (n) => n.toFixed(1);
  let g = '';
  for (const v of ys.ticks) {
    const y = f(Y(v));
    g += '<line class="ch-grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '"/>' +
      '<text class="ch-tick" x="' + (padL - 8) + '" y="' + y + '" dy="0.32em" text-anchor="end">' + esc(fmtTick(v)) + '</text>';
  }
  let xt = timeTicks(t0, t1, Math.max(2, Math.floor(pw / 64)));
  if (!xt.length) xt = [{ t: o.pts[0].t, label: fmtDate(isoDate(new Date(o.pts[0].t))) }];
  for (const k of xt) {
    const x = X(k.t);
    const anchor = x < padL + 22 ? 'start' : x > W - padR - 22 ? 'end' : 'middle';
    g += '<text class="ch-tick" x="' + f(x) + '" y="' + (H - 7) + '" text-anchor="' + anchor + '">' + esc(k.label) + '</text>';
  }
  let lastLabelEdge = -Infinity;
  for (const m of markers) {
    const x = clamp(X(m.t), padL, W - padR);
    g += '<line class="ch-mark" x1="' + f(x) + '" x2="' + f(x) + '" y1="' + (padT - 8) + '" y2="' + (padT + ph) + '"/><circle class="ch-pin" cx="' + f(x) + '" cy="' + (padT - 8) + '" r="3"/>';
    const label = m.label.length > 24 ? m.label.slice(0, 23) + '…' : m.label;
    const est = label.length * 6.2;
    const right = x + 7 + est <= W - padR;
    const left = right ? x + 7 : x - 7 - est;
    if (left > lastLabelEdge + 6) {
      g += '<text class="ch-mark-label" x="' + f(right ? x + 7 : x - 7) + '" y="' + (padT - 4.5) + '" text-anchor="' + (right ? 'start' : 'end') + '">' + esc(label) + '</text>';
      lastLabelEdge = left + est;
    }
  }
  for (const r of o.raw || []) g += '<circle class="ch-raw" cx="' + f(X(r.t)) + '" cy="' + f(Y(r.v)) + '" r="3.5"/>';
  const pts = o.pts.map((q) => Object.assign({}, q, { x: X(q.t), y: Y(q.v) }));
  if (pts.length > 1) g += '<path class="ch-line" d="' + pts.map((q, i) => (i ? 'L' : 'M') + f(q.x) + ' ' + f(q.y)).join(' ') + '"/>';
  if (pts.length <= 40) pts.slice(0, -1).forEach((q) => { g += '<circle class="ch-dot" cx="' + f(q.x) + '" cy="' + f(q.y) + '" r="3.5"/>'; });
  const end = pts[pts.length - 1];
  g += '<circle class="ch-dot" cx="' + f(end.x) + '" cy="' + f(end.y) + '" r="5"/>';
  if (o.endFmt) {
    const anchor = end.x > W - padR - 28 ? 'end' : end.x < padL + 28 ? 'start' : 'middle';
    const ey = end.y - 12 < padT + 2 ? end.y + 21 : end.y - 12;
    g += '<text class="ch-end" x="' + f(anchor === 'end' ? end.x - 8 : end.x) + '" y="' + f(ey) + '" text-anchor="' + anchor + '">' + esc(o.endFmt(end)) + '</text>';
  }
  g += '<line class="ch-cross" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + ph) + '" visibility="hidden"/><circle class="ch-hi" r="6" cx="0" cy="0" visibility="hidden"/>';
  g += '<rect class="ch-hit" x="0" y="0" width="' + W + '" height="' + H + '"/>';
  S.charts[o.id] = { W, pts, tip: o.tip };
  return '<div class="chart" data-chart="' + esc(o.id) + '"><svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" tabindex="0" aria-label="' + esc(o.aria) + '">' + g + '</svg>' +
    '<div class="ch-tip" aria-hidden="true"><span class="td"></span><span class="tv"><i></i><b></b></span><span class="ts"></span></div></div>';
}
function bindCharts(root) {
  $$('.chart', root).forEach((wrap) => {
    const c = S.charts[wrap.dataset.chart];
    const svg = wrap.querySelector('svg');
    if (!c || !svg || !c.pts.length) return;
    const tip = wrap.querySelector('.ch-tip');
    const cross = svg.querySelector('.ch-cross');
    const hi = svg.querySelector('.ch-hi');
    let timer = null;
    const show = (i) => {
      i = clamp(i, 0, c.pts.length - 1);
      c.cur = i;
      const q = c.pts[i];
      cross.setAttribute('x1', q.x); cross.setAttribute('x2', q.x); cross.setAttribute('visibility', 'visible');
      hi.setAttribute('cx', q.x); hi.setAttribute('cy', q.y); hi.setAttribute('visibility', 'visible');
      const info = c.tip(q);
      tip.querySelector('.td').textContent = info.d;
      tip.querySelector('.tv b').textContent = info.v;
      const ts = tip.querySelector('.ts');
      ts.textContent = info.s || '';
      ts.hidden = !info.s;
      tip.classList.add('show');
      const r = svg.getBoundingClientRect();
      const px = q.x * (r.width / c.W);
      const tw = tip.offsetWidth, ww = wrap.clientWidth;
      const left = clamp(px > ww / 2 ? px - tw - 12 : px + 12, 0, Math.max(0, ww - tw));
      tip.style.transform = 'translateX(' + Math.round(left) + 'px)';
    };
    const hide = () => { cross.setAttribute('visibility', 'hidden'); hi.setAttribute('visibility', 'hidden'); tip.classList.remove('show'); };
    const nearest = (clientX) => {
      const r = svg.getBoundingClientRect();
      const xv = (clientX - r.left) * (c.W / r.width);
      let best = 0, bd = Infinity;
      c.pts.forEach((q, i) => { const d = Math.abs(q.x - xv); if (d < bd) { bd = d; best = i; } });
      return best;
    };
    svg.addEventListener('pointerdown', (e) => { clearTimeout(timer); show(nearest(e.clientX)); });
    svg.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) { clearTimeout(timer); show(nearest(e.clientX)); } });
    svg.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hide(); });
    svg.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') { clearTimeout(timer); timer = setTimeout(hide, 2600); } });
    svg.addEventListener('pointercancel', () => { clearTimeout(timer); timer = setTimeout(hide, 400); });
    svg.addEventListener('focus', () => show(c.cur != null ? c.cur : c.pts.length - 1));
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        show((c.cur != null ? c.cur : c.pts.length - 1) + (e.key === 'ArrowRight' ? 1 : -1));
      } else if (e.key === 'Escape') hide();
    });
  });
}

function liftCard(l, W, t0, t1, rs) {

  if (!allPts.length) return h + '<p class="chart-note">Log ' + esc(l.name) + ' once and its chart starts here.</p>' + accSection(l, W) + '<div></div></section>';

      '<div class="pr-cell pr-reps"><span class="qlabel">Rep records</span><div class="rr-list">' + rec.reps.slice(0, 6).map((q) =>
        '<span>' + esc(wLabel(q.set) + ' × ' + q.set.r) + '<small>' + fmtDate(q.date) + '</small></span>').join('') + '</div></div></div>';

function bwCard(W, rs, t1) {
  const series = bwSeries();

  const goal = S.settings.goal;
  let h = '<section class="card prog-card"><div class="pc-head"><div class="pc-titles"><h2 class="pc-name">Body weight</h2>';
  if (!series.length) return h + '<p class="pc-sub">' + capFirst(goal) + '</p></div></div><p class="chart-note">Log a weigh-in on Today to start this chart.</p><div></div></section>';
  const last = series[series.length - 1];
  const trend = bwTrend();
  const sub = [capFirst(goal), '7-day avg ' + fmtW(last.avg)];
  if (trend) sub.push((trend.perWeek >= 0 ? '+' : '−') + fmtNum(Math.abs(toDisp(trend.perWeek))) + ' ' + units() + '/week');
  let big = '<span class="pc-val">' + fmtW(last.lb) + '<small>' + units() + '</small></span>';
  if (pts.length > 1) {
    const d = toDisp(pts[pts.length - 1].avg) - toDisp(pts[0].avg);
    const good = (goal === 'cutting' && d < -0.05) || (goal === 'bulking' && d > 0.05);
    big += '<span class="delta ' + (good ? 'up' : 'flat') + '">' + (d > 0.05 ? '+' : d < -0.05 ? '−' : '±') + fmtNum(Math.abs(d)) + ' since ' + fmtDate(pts[0].date) + '</span>';
  }
  h += '<p class="pc-sub">' + esc(sub.join(' · ')) + '</p></div><div class="pc-big">' + big + '</div></div>';
  if (!pts.length) return h + '<p class="chart-note">No weigh-ins in this range.</p><div></div></section>';
  h += '<div class="legend"><span><i class="key-dot"></i>Weigh-ins</span><span><i class="key-line"></i>7-day average</span></div>';
  h += chartSvg({
    id: 'bw', W, t0: Math.max(rs, pts[0].t), t1,
    pts: pts.map((q) => ({ t: q.t, v: toDisp(q.avg), p: q })),
    raw: pts.map((q) => ({ t: q.t, v: toDisp(q.lb) })),
    endFmt: (q) => fmtW(q.p.avg),
    aria: 'Body weight across ' + pts.length + ' weigh-ins, latest ' + fmtW(last.lb) + ' ' + units() + ', 7-day average ' + fmtW(last.avg),
    tip: (q) => ({ d: fmtDay(q.p.date) + (q.p.sample ? ' · sample' : ''), v: fmtW(q.p.avg) + ' ' + units() + ' avg', s: 'Weigh-in ' + fmtW(q.p.lb) + ' ' + units() }),
  });

  h += '<details class="tbl"><summary>' + icon('chevron') + 'Show data</summary><div class="tbl-wrap"><table><thead><tr><th>Date</th><th class="r">Weigh-in</th><th class="r">7-day avg</th><th></th></tr></thead><tbody>' +
    pts.slice().reverse().map((q) => '<tr><td>' + fmtDate(q.date) + (q.sample ? ' <span class="badge">Sample</span>' : '') + '</td><td class="r">' + fmtW(q.lb) + '</td><td class="r">' + fmtW(q.avg) + '</td><td class="r">' +

    '</tbody></table></div></details>';
  return h + '</section>';
}
